<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b2a4a">
<title>Dəniz Yolu</title>
<style>
/* Dəniz Yolu — arcade. Palette: deep sea blue + warm signal orange. */
:root{--vh:1vh;--ui:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif}
@supports (height:1dvh){:root{--vh:1dvh}}
*{box-sizing:border-box}
html,body{
  height:100%;margin:0;overflow:hidden;background:#06192e;color:#fff;font-family:var(--ui);
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#app{height:calc(100 * var(--vh));display:flex;flex-direction:column;align-items:center;padding:6px 6px max(6px,env(safe-area-inset-bottom));gap:6px}
.bar{width:100%;max-width:640px;display:flex;justify-content:space-between;align-items:center;flex:none}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:999px;border:0;cursor:pointer;
  color:#e6f4ff;text-decoration:none;font:700 13px/1 var(--ui);
  background:linear-gradient(#1a4f82,#0d3560);box-shadow:0 0 0 2px #3b83c7,0 3px 0 #04101f,inset 0 1px 0 rgba(255,255,255,.3);
}
.chip:active{transform:translateY(2px)}
.chip svg{width:18px;height:18px;fill:currentColor}
#soundBtn{width:40px;padding:0;justify-content:center}
#soundBtn .off{display:none}#soundBtn.muted .on{display:none}#soundBtn.muted .off{display:block}#soundBtn.muted{color:#ff9a9a}
.title{font:900 italic 18px/1 "Arial Black",Impact,sans-serif;letter-spacing:.06em;color:#ffd78a;text-shadow:0 2px 0 #04101f}
.wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
canvas{
  display:block;touch-action:none;
  border-radius:18px;box-shadow:0 0 0 3px #3b83c7,0 0 0 6px #06192e,0 12px 36px rgba(0,0,0,.6);background:#1b6ca8;
}
html,body{-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
@supports (padding:max(0px)){body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}}
@media (pointer:coarse){.chip{min-height:42px}#soundBtn{min-width:44px}}
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <a class="chip" href="index.html"><svg viewBox="0 0 24 24"><path d="M15.4 5.4 8.8 12l6.6 6.6 1.8-1.8L12.4 12l4.8-4.8z"/></svg>Menyuya qayıt</a>
    <span class="title">DƏNİZ YOLU</span>
    <button class="chip" id="soundBtn" aria-label="Səsi aç/bağla">
      <svg class="on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.6 3 2.4-2.4-1.4-1.4-2.4 2.4-2.4-2.4-1.4 1.4 2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4z"/></svg>
    </button>
  </div>
  <div class="wrap"><canvas id="c" width="360" height="560"></canvas></div>
</div>

<script>
/* =====================================================================
   DƏNİZ YOLU — dodge rocks, collect containers, keep the high score.
   Core rules are the original ones; the simulation runs at a fixed 60 Hz.
   ===================================================================== */
(function () {
'use strict';
const W = 360, H = 560, SHIP_Y = 500;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);

/* ---- Storage helper ---- */
const Store = {
  prefix: 'gemi_oyun1_',
  get(k, d) { try { const r = localStorage.getItem(this.prefix + k); return r === null ? d : JSON.parse(r); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(this.prefix + k, JSON.stringify(v)); } catch (e) {} }
};
// the very first version saved the record under the plain key "best"
let best = +Store.get('best', 0) || 0;
if (!best) { try { best = +localStorage.getItem('best') || 0; } catch (e) {} }

/* ---- Audio helper (synthesized; unlocks on first gesture) ---- */
const Sound = (function () {
  let ctx = null, master = null, nbuf = null, muted = !!Store.get('muted', false);
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      master = ctx.createGain(); master.gain.value = muted ? 0 : 0.8; master.connect(ctx.destination);
      nbuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state !== 'running') ctx.resume().catch(function () {});
    return ctx;
  }
  function unlock() {
    ensure();
    if (ctx && ctx.state === 'running') ['pointerdown', 'pointerup', 'touchstart', 'touchend', 'click', 'keydown', 'mousedown'].forEach(function (e) { window.removeEventListener(e, unlock, true); });
  }
  ['pointerdown', 'pointerup', 'touchstart', 'touchend', 'click', 'keydown', 'mousedown'].forEach(function (e) { window.addEventListener(e, unlock, true); });
  document.addEventListener('visibilitychange', function () { if (!ctx) return; if (document.hidden) { ctx.suspend().catch(function () {}); } else if (ctx.state !== 'running') { ctx.resume().catch(function () {}); } });
  function tone(o) {
    if (muted) return; const c = ensure(); if (!c) return;
    const t0 = c.currentTime + (o.at || 0), dur = o.dur || 0.2, vol = o.vol == null ? 0.25 : o.vol;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(o.f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.to), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + (o.atk || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    let last = osc;
    if (o.lp) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; osc.connect(f); last = f; }
    last.connect(g); g.connect(master); osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  function noise(o) {
    if (muted) return; const c = ensure(); if (!c) return;
    const t0 = c.currentTime + (o.at || 0), dur = o.dur || 0.2;
    const s = c.createBufferSource(); s.buffer = nbuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = o.type || 'lowpass'; f.frequency.setValueAtTime(o.f || 800, t0);
    if (o.to) f.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, o.vol == null ? 0.3 : o.vol), t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur + 0.05);
  }
  function setMuted(m) { muted = m; Store.set('muted', m); if (ctx) master.gain.setTargetAtTime(m ? 0 : 0.8, ctx.currentTime, 0.02); }
  return { ensure: ensure, tone: tone, noise: noise, setMuted: setMuted, isMuted: function () { return muted; } };
})();
function buzz(p) { try { if (navigator.vibrate && !Sound.isMuted()) navigator.vibrate(p); } catch (e) {} }
const SFX = {
  start() { Sound.tone({ f: 110, to: 96, dur: 0.7, type: 'sawtooth', vol: 0.16, lp: 500, atk: 0.06 }); Sound.tone({ f: 165, to: 144, dur: 0.7, type: 'sawtooth', vol: 0.1, lp: 500, atk: 0.06 }); },
  collect() { [880, 1175, 1568].forEach(function (f, i) { Sound.tone({ f: f, dur: 0.16, vol: 0.18, type: 'triangle', at: i * 0.055 }); }); Sound.noise({ dur: 0.12, vol: 0.12, type: 'highpass', f: 3000 }); },
  tick() { Sound.tone({ f: 1400, dur: 0.03, vol: 0.03, type: 'square' }); },
  crash() { Sound.noise({ dur: 0.7, vol: 0.6, type: 'lowpass', f: 1800, to: 120 }); Sound.tone({ f: 120, to: 35, dur: 0.6, vol: 0.6, type: 'sine' }); Sound.tone({ f: 320, to: 80, dur: 0.25, vol: 0.2, type: 'sawtooth', lp: 900 }); },
  over() { [392, 330, 262, 196].forEach(function (f, i) { Sound.tone({ f: f, dur: 0.3, vol: 0.14, type: 'triangle', at: 0.5 + i * 0.22 }); }); },
  record() { [523, 659, 784, 1047, 1319].forEach(function (f, i) { Sound.tone({ f: f, dur: 0.22, vol: 0.16, type: 'triangle', at: 1.2 + i * 0.08 }); }); }
};

/* ---- Canvas setup (crisp on high-DPI, scales to any screen) ---- */
const cv = $('c'), g = cv.getContext('2d');
let scale = 1;
function resize() {
  // fit the 360x560 playfield inside the free area, keeping the aspect ratio exactly
  const wrap = cv.parentNode, aw = wrap.clientWidth - 12, ah = wrap.clientHeight - 12;
  const fit = Math.max(120, Math.min(aw, ah * W / H));
  cv.style.width = Math.floor(fit) + 'px'; cv.style.height = Math.floor(fit * H / W) + 'px';
  const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const cw = Math.max(1, Math.round(r.width * dpr)), ch = Math.round(cw * H / W);
  if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
  scale = cw / W;
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv.parentNode);

/* ---- Particle system ---- */
const parts = [], texts = [];
function spawnP(p) { if (parts.length > 260) parts.shift(); parts.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, life: 40, age: 0, size: 3, grow: 0, kind: 'foam', color: '#fff', g: 0 }, p)); }

/* ---- Game state ---- */
let state = 'ready';            // ready | play | over | paused
let ship, items, score, t, speed, spawnT, shake = 0, overAt = 0, newRecord = false, flashT = 0;
const keys = {};
let target = 180, lastTouchX = null, tilt = 0;
const bgOffset = { a: 0, b: 0 };

function reset() {
  ship = { x: 180 }; target = 180; items = []; score = 0; t = 0; speed = 2; spawnT = 0;
  parts.length = 0; texts.length = 0; newRecord = false; tilt = 0;
}
reset();

function begin() {
  if (state === 'over' && performance.now() - overAt < 700) return;   // avoid accidental instant restart
  if (state === 'paused') { state = 'play'; return; }
  if (state === 'play') return;
  reset(); state = 'play'; SFX.start();
}

/* ---- Input: keyboard, mouse/touch drag (relative, so the finger never hides the ship) ---- */
window.addEventListener('keydown', function (e) {
  const k = e.key;
  if (['ArrowLeft', 'ArrowRight', ' ', 'Enter'].indexOf(k) >= 0) e.preventDefault();
  keys[k] = true;
  if (k === 'Enter' || k === ' ') begin();
  if (k === 'p' || k === 'P' || k === 'Escape') { if (state === 'play') state = 'paused'; else if (state === 'paused') state = 'play'; }
});
window.addEventListener('keyup', function (e) { keys[e.key] = false; });
window.addEventListener('blur', function () { for (const k in keys) keys[k] = false; if (state === 'play') state = 'paused'; });
document.addEventListener('visibilitychange', function () { if (document.hidden && state === 'play') state = 'paused'; });

function toGameX(clientX) { const r = cv.getBoundingClientRect(); return (clientX - r.left) * W / r.width; }
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault();
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  if (state !== 'play') { begin(); lastTouchX = null; return; }
  lastTouchX = toGameX(e.clientX);
});
cv.addEventListener('pointermove', function (e) {
  if (lastTouchX === null || state !== 'play') return;
  const x = toGameX(e.clientX);
  target = clamp(target + (x - lastTouchX) * 1.25, 20, 340);
  lastTouchX = x;
}, { passive: true });
['pointerup', 'pointercancel'].forEach(function (ev) { cv.addEventListener(ev, function () { lastTouchX = null; }); });
cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

$('soundBtn').addEventListener('click', function () {
  Sound.setMuted(!Sound.isMuted()); this.classList.toggle('muted', Sound.isMuted()); Sound.ensure();
  if (!Sound.isMuted()) SFX.collect();
});
$('soundBtn').classList.toggle('muted', Sound.isMuted());

/* ---- Simulation tick (exactly one original frame: 1/60 s) ---- */
function addRock() {
  // jagged polygon so every rock looks different
  const n = 9, pts = [], r0 = rand(16, 21);
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, r = r0 * rand(0.78, 1.1); pts.push([Math.cos(a) * r, Math.sin(a) * r * 0.92]); }
  return pts;
}
function tick() {
  t++;
  // controls: keys nudge the target, ship eases towards it
  const kd = (keys.ArrowLeft || keys.a || keys.A ? -1 : 0) + (keys.ArrowRight || keys.d || keys.D ? 1 : 0);
  if (kd) target = clamp(target + kd * 5.5, 20, 340);
  const prevX = ship.x;
  ship.x += (target - ship.x) * 0.4;
  ship.x = clamp(ship.x, 20, 340);
  tilt += (clamp((ship.x - prevX) * 0.06, -0.35, 0.35) - tilt) * 0.2;

  // spawn rate and speed ramp up smoothly with the score (original: every 40 frames, speed 2 + score/100)
  const interval = Math.max(22, 40 - score * 0.045);
  spawnT++;
  if (spawnT >= interval) {
    spawnT = 0;
    const isRock = Math.random() < 0.65;
    items.push({ x: rand(20, 340), y: -24, type: isRock ? 'rock' : 'box', shape: isRock ? addRock() : null, rot: rand(0, 6), color: ['#e0453a', '#2f7fd6', '#f2b630', '#35a86b'][(Math.random() * 4) | 0], ph: rand(0, 6) });
  }
  if (t % 60 === 0) { score++; if (score % 10 === 0) SFX.tick(); }
  const targetSpeed = Math.min(7.5, 2 + score / 100);
  speed += (targetSpeed - speed) * 0.05;

  items.forEach(function (i) { i.y += speed; i.rot += i.type === 'rock' ? 0.004 : 0; });
  items = items.filter(function (i) {
    if (Math.abs(i.x - ship.x) < 24 && Math.abs(i.y - SHIP_Y) < 28) {            // original hit-box
      if (i.type === 'box') { score += 10; collectFx(i); return false; }
      crash(i); return true;
    }
    return i.y < 580;
  });

  // ship wake: foam trail + bow wave
  for (let k = 0; k < 2; k++) {
    spawnP({ x: ship.x + rand(-5, 5), y: SHIP_Y + 26, vx: rand(-0.5, 0.5) + (k ? 0.7 : -0.7), vy: speed * 0.6 + rand(0, 0.8), life: rand(30, 52), size: rand(2.5, 4.5), grow: 0.09, kind: 'foam' });
  }
  if (t % 3 === 0) spawnP({ x: ship.x + rand(-4, 4), y: SHIP_Y - 30, vx: rand(-1.4, 1.4), vy: speed * 0.5 + 0.4, life: 24, size: 2, grow: 0.06, kind: 'foam' });
  bgOffset.a = (bgOffset.a + speed) % 50;
  bgOffset.b = (bgOffset.b + speed * 0.55) % 90;
}
function collectFx(i) {
  SFX.collect(); buzz(15);
  for (let k = 0; k < 14; k++) { const a = rand(0, 6.28), v = rand(1, 3.5); spawnP({ x: i.x, y: i.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1.2, g: 0.12, life: rand(24, 40), size: rand(2, 4), kind: 'drop', color: k % 3 ? '#bfe6ff' : '#ffe08a' }); }
  texts.push({ x: i.x, y: i.y - 10, age: 0, text: '+10', color: '#ffe08a' });
  flashT = 0.12;
}
function crash(i) {
  state = 'over'; overAt = performance.now(); shake = 22;
  if (score > best) { newRecord = true; best = score; Store.set('best', best); }
  SFX.crash(); SFX.over(); buzz([60, 40, 140]); if (newRecord) SFX.record();
  for (let k = 0; k < 40; k++) { const a = rand(0, 6.28), v = rand(1, 6); spawnP({ x: ship.x, y: SHIP_Y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0.1, life: rand(30, 70), size: rand(2, 6), kind: k % 2 ? 'debris' : 'drop', color: k % 3 ? '#ffb347' : '#ff5a3c' }); }
  parts.push({ x: ship.x, y: SHIP_Y, vx: 0, vy: 0, g: 0, life: 26, age: 0, size: 10, grow: 3.2, kind: 'ring', color: '#fff' });
}

/* ---- Rendering ---- */
function mix(c1, c2, k) { return [lerp(c1[0], c2[0], k) | 0, lerp(c1[1], c2[1], k) | 0, lerp(c1[2], c2[2], k) | 0]; }
function seaColors() {
  // day -> dusk -> night as the score grows (smooth)
  const day = [[27, 108, 168], [14, 70, 125]], dusk = [[92, 98, 170], [40, 52, 110]], night = [[16, 40, 84], [6, 16, 42]];
  const k = clamp(score / 150, 0, 2);
  const a = k < 1 ? day : dusk, b = k < 1 ? dusk : night, f = k < 1 ? k : k - 1;
  return [mix(a[0], b[0], f), mix(a[1], b[1], f)];
}
function drawSea() {
  const c = seaColors();
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, 'rgb(' + c[1].join(',') + ')'); gr.addColorStop(1, 'rgb(' + c[0].join(',') + ')');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // wave lines (original look, two parallax layers)
  g.lineWidth = 2;
  for (let layer = 0; layer < 2; layer++) {
    const sp = layer ? 90 : 50, off = layer ? bgOffset.b : bgOffset.a, amp = layer ? 4 : 6;
    g.strokeStyle = 'rgba(255,255,255,' + (layer ? 0.12 : 0.25) + ')';
    for (let y = -sp; y < H + sp; y += sp) {
      const yy = y + off; g.beginPath();
      for (let x = 0; x <= W; x += 20) g.lineTo(x, yy + Math.sin((x + t * (layer ? 1.2 : 2)) / (layer ? 32 : 25)) * amp);
      g.stroke();
    }
  }
  // soft light bands
  g.globalAlpha = 0.07; g.fillStyle = '#fff';
  for (let i = 0; i < 4; i++) { const x = (i * 97 + t * 0.15) % (W + 120) - 60; g.beginPath(); g.ellipse(x, 100 + i * 120, 70, 14, 0.2, 0, 6.3); g.fill(); }
  g.globalAlpha = 1;
}
function drawRock(i) {
  g.save(); g.translate(i.x, i.y);
  // foam ring where the sea meets the rock
  g.fillStyle = 'rgba(255,255,255,.28)'; g.beginPath(); g.ellipse(0, 3, 30 + Math.sin(t / 12 + i.ph) * 2, 25, 0, 0, 6.3); g.fill();
  g.fillStyle = 'rgba(0,0,0,.22)'; g.beginPath(); g.ellipse(4, 8, 22, 17, 0, 0, 6.3); g.fill();
  g.rotate(i.rot);
  g.beginPath(); i.shape.forEach(function (p, k) { k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }); g.closePath();
  const gr = g.createRadialGradient(-6, -7, 2, 0, 0, 24); gr.addColorStop(0, '#b9c2cc'); gr.addColorStop(0.6, '#7a8794'); gr.addColorStop(1, '#4b5662');
  g.fillStyle = gr; g.fill(); g.lineWidth = 2.5; g.strokeStyle = '#2c3540'; g.lineJoin = 'round'; g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2; g.beginPath(); g.moveTo(-9, -8); g.lineTo(-2, -12); g.lineTo(5, -8); g.stroke();
  g.restore();
}
function drawBox(i) {
  const bob = Math.sin(t / 14 + i.ph);
  g.save(); g.translate(i.x, i.y + bob * 1.5); g.rotate(Math.sin(t / 22 + i.ph) * 0.1);
  g.fillStyle = 'rgba(0,0,0,.2)'; g.beginPath(); g.ellipse(3, 9, 18, 8, 0, 0, 6.3); g.fill();
  g.fillStyle = 'rgba(255,255,255,.3)'; g.beginPath(); g.ellipse(0, 4, 24, 14, 0, 0, 6.3); g.fill();   // foam
  g.fillStyle = i.color; g.strokeStyle = '#1c2530'; g.lineWidth = 2.5; g.lineJoin = 'round';
  g.beginPath(); g.rect(-15, -10, 30, 20); g.fill(); g.stroke();
  g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 2;
  g.beginPath(); for (let x = -9; x <= 9; x += 6) { g.moveTo(x, -9); g.lineTo(x, 9); } g.stroke();
  g.fillStyle = 'rgba(255,255,255,.4)'; g.fillRect(-14, -9, 28, 3);
  // little sparkle so the player notices it is a pickup
  const s = (Math.sin(t / 8 + i.ph) + 1) / 2; g.fillStyle = 'rgba(255,255,255,' + (0.4 + s * 0.5) + ')';
  g.beginPath(); g.moveTo(12, -16); g.lineTo(14, -12); g.lineTo(18, -10); g.lineTo(14, -8); g.lineTo(12, -4); g.lineTo(10, -8); g.lineTo(6, -10); g.lineTo(10, -12); g.fill();
  g.restore();
}
function drawShip() {
  g.save(); g.translate(ship.x, SHIP_Y); g.rotate(tilt);
  g.fillStyle = 'rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(4, 6, 20, 34, 0, 0, 6.3); g.fill();
  // hull
  g.beginPath(); g.moveTo(0, -36); g.bezierCurveTo(16, -24, 19, 0, 16, 28); g.lineTo(-16, 28); g.bezierCurveTo(-19, 0, -16, -24, 0, -36); g.closePath();
  g.fillStyle = '#c9392e'; g.fill(); g.lineWidth = 3; g.strokeStyle = '#1d2733'; g.lineJoin = 'round'; g.stroke();
  // deck
  g.beginPath(); g.moveTo(0, -29); g.bezierCurveTo(11, -20, 13, 0, 11, 24); g.lineTo(-11, 24); g.bezierCurveTo(-13, 0, -11, -20, 0, -29); g.closePath();
  g.fillStyle = '#efe5cc'; g.fill(); g.lineWidth = 1.5; g.stroke();
  // cargo hatch + bridge + funnel
  g.fillStyle = '#6d8aa6'; g.fillRect(-7, -16, 14, 10); g.strokeRect(-7, -16, 14, 10);
  g.fillStyle = '#fff'; g.fillRect(-9, 2, 18, 13); g.strokeRect(-9, 2, 18, 13);
  g.fillStyle = '#3a7bbd'; g.fillRect(-7, 4, 14, 4);
  g.fillStyle = '#f2b630'; g.beginPath(); g.arc(0, 19, 4.6, 0, 6.3); g.fill(); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.ellipse(-8, -8, 2, 12, 0.1, 0, 6.3); g.fill();
  g.restore();
}
function drawParticles() {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.age++;
    if (p.age >= p.life) { parts.splice(i, 1); continue; }
    if (state !== 'paused') { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.size += p.grow; }
    const k = 1 - p.age / p.life;
    if (p.kind === 'foam') { g.fillStyle = 'rgba(255,255,255,' + (k * 0.55).toFixed(3) + ')'; g.beginPath(); g.arc(p.x, p.y, p.size, 0, 6.3); g.fill(); }
    else if (p.kind === 'drop') { g.fillStyle = p.color; g.globalAlpha = k; g.beginPath(); g.arc(p.x, p.y, p.size, 0, 6.3); g.fill(); g.globalAlpha = 1; }
    else if (p.kind === 'debris') { g.fillStyle = p.color; g.globalAlpha = k; g.fillRect(p.x, p.y, p.size, p.size * 0.6); g.globalAlpha = 1; }
    else if (p.kind === 'ring') { g.strokeStyle = 'rgba(255,255,255,' + k.toFixed(2) + ')'; g.lineWidth = 4 * k + 1; g.beginPath(); g.arc(p.x, p.y, p.size, 0, 6.3); g.stroke(); }
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    const x = texts[i]; x.age++; if (x.age > 50) { texts.splice(i, 1); continue; }
    const k = x.age / 50;
    g.globalAlpha = 1 - k * k; g.font = '900 ' + (18 + Math.sin(k * 3) * 4) + 'px "Arial Black",system-ui,sans-serif'; g.textAlign = 'center';
    g.lineWidth = 4; g.strokeStyle = '#1c2530'; g.strokeText(x.text, x.x, x.y - k * 40); g.fillStyle = x.color; g.fillText(x.text, x.x, x.y - k * 40); g.globalAlpha = 1;
  }
}
function shadowText(txt, x, y, size, color, weight) {
  g.font = (weight || '800') + ' ' + size + 'px "Trebuchet MS","Segoe UI",system-ui,sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = Math.max(3, size / 6); g.lineJoin = 'round'; g.strokeStyle = 'rgba(6,25,46,.85)'; g.strokeText(txt, x, y); g.fillStyle = color || '#fff'; g.fillText(txt, x, y);
}
function drawHUD() {
  g.fillStyle = 'rgba(6,25,46,.5)'; g.beginPath(); g.roundRect ? g.roundRect(10, 8, 340, 32, 16) : g.rect(10, 8, 340, 32); g.fill();
  shadowText('Xal: ' + score + '   Rekord: ' + best, 180, 25, 18, '#fff');
}
function overlay(lines) {
  g.fillStyle = 'rgba(4,16,31,.62)'; g.fillRect(0, 0, W, H);
  lines.forEach(function (l) { shadowText(l[0], 180, l[1], l[2], l[3], l[4]); });
}
function render() {
  g.setTransform(scale, 0, 0, scale, 0, 0);
  g.save();
  if (shake > 0.3) { g.translate(rand(-shake, shake), rand(-shake, shake)); shake *= 0.9; } else shake = 0;
  drawSea();
  items.forEach(function (i) { i.type === 'rock' ? drawRock(i) : drawBox(i); });
  drawParticles();
  if (state !== 'over') drawShip();
  g.restore();
  if (flashT > 0) { g.fillStyle = 'rgba(255,240,200,' + flashT + ')'; g.fillRect(0, 0, W, H); flashT = Math.max(0, flashT - 0.01); }
  drawHUD();
  const pulse = 1 + Math.sin(performance.now() / 300) * 0.05;
  if (state === 'ready') {
    overlay([['Dəniz Yolu', 190, 40 * pulse, '#ffd78a', '900'], ['Qayalardan qaç,', 250, 20, '#fff'], ['konteynerləri topla!', 276, 20, '#fff'],
      ['Barmağını sürüşdür  /  ← → düymələri', 340, 15, '#bfe6ff', '700'], ['Başlamaq üçün toxun / Enter', 400, 18 * pulse, '#ffe08a']]);
  } else if (state === 'over') {
    overlay([['Gəmi qayaya dəydi!', 220, 27, '#fff', '900'], ['Xalın: ' + score, 272, 22, '#ffe08a'],
      [newRecord ? 'Yeni rekord!' : 'Rekord: ' + best, 308, 18, newRecord ? '#7bf06b' : '#bfe6ff'], ['Yenidən başlamaq üçün toxun', 366, 18 * pulse, '#fff']]);
  } else if (state === 'paused') {
    overlay([['Fasilə', 250, 36, '#ffd78a', '900'], ['Davam etmək üçün toxun / Enter', 300, 17, '#fff']]);
  }
}

/* ---- Fixed-step main loop ---- */
let last = performance.now(), acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  acc += Math.min(0.1, (ts - last) / 1000); last = ts;
  const step = 1 / 60;
  while (acc >= step) { if (state === 'play') tick(); else if (state === 'over' || state === 'ready') { bgOffset.a = (bgOffset.a + 0.6) % 50; bgOffset.b = (bgOffset.b + 0.3) % 90; t++; } acc -= step; }
  render();
}
resize();
requestAnimationFrame(frame);
})();
</script>
