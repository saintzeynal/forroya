<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e3552">
<title>Balıq Tutma</title>
<style>
/* Balıq Tutma — calm fishing. Soft blues, warm dawn/dusk light, no pressure. */
:root{--vh:1vh;--ui:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Arial,sans-serif;--ink:#0d2a40;--glass:rgba(8,32,52,.62)}
@supports (height:1dvh){:root{--vh:1dvh}}
*{box-sizing:border-box}
html,body{
  height:100%;margin:0;overflow:hidden;background:#0b2a40;color:#fff;font-family:var(--ui);
  touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#app{position:relative;height:calc(100 * var(--vh));width:100%;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:0;right:0;z-index:3;display:flex;gap:8px;padding:8px 8px;pointer-events:none}
.hud>*{pointer-events:auto}
.top{top:0;align-items:center;justify-content:space-between;padding-top:max(8px,env(safe-area-inset-top))}
.chip{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;border:0;cursor:pointer;
  color:#eaf8ff;text-decoration:none;font:700 13px/1 var(--ui);white-space:nowrap;
  background:var(--glass);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 0 0 1.5px rgba(160,220,255,.5),0 4px 10px rgba(0,0,0,.25);
}
.chip:active{transform:scale(.96)}
.chip svg{width:18px;height:18px;fill:currentColor}
.right{display:flex;gap:8px}
#soundBtn{width:40px;padding:0}
#soundBtn .off{display:none}#soundBtn.muted .on{display:none}#soundBtn.muted .off{display:block}#soundBtn.muted{color:#ffaaa0}
#albumBtn b{color:#ffe27a}
.timechip{position:absolute;left:8px;top:calc(max(8px,env(safe-area-inset-top)) + 44px);z-index:3;height:30px;padding:0 12px;font-size:12.5px;pointer-events:none}
.timechip svg{width:16px;height:16px}

.bottom{bottom:0;flex-direction:column;align-items:center;gap:8px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
#tip{min-height:18px;max-width:92%;text-align:center;font-size:13px;font-weight:700;color:#eaf8ff;text-shadow:0 1px 4px rgba(0,0,0,.6);pointer-events:none}
#powerWrap{width:min(78%,320px);height:26px;position:relative;opacity:0;transition:opacity .2s;pointer-events:none}
#powerWrap.on{opacity:1}
#powerBar{position:absolute;left:0;right:0;top:0;height:14px;border-radius:8px;background:rgba(5,25,40,.6);box-shadow:inset 0 0 0 1.5px rgba(160,220,255,.5);overflow:hidden}
#powerFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#7fe3c8,#59b8ff,#7b8cff);border-radius:8px}
#powerBar i{position:absolute;top:0;bottom:0;width:1.5px;background:rgba(255,255,255,.55)}
#powerLabels{position:absolute;left:0;right:0;top:15px;display:flex;font-size:10.5px;font-weight:700;color:#cfeeff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
#powerLabels span{flex:1;text-align:center}
#act{
  min-width:min(86%,280px);height:62px;padding:0 24px;border:0;border-radius:32px;cursor:pointer;color:#fff;
  font:800 18px/1.15 var(--ui);letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,40,70,.5);
  background:linear-gradient(#58c8ff,#2a86d6 55%,#1a62ac);box-shadow:0 5px 0 #0c3c72,0 0 0 3px rgba(255,255,255,.7) inset,0 8px 18px rgba(0,0,0,.35);
  transition:transform .08s,filter .2s;
}
#act:active,#act.held{transform:translateY(4px);box-shadow:0 1px 0 #0c3c72,0 0 0 3px rgba(255,255,255,.7) inset}
#act[data-s="bite"]{background:linear-gradient(#ffd75e,#ff9d1e 55%,#d9730a);box-shadow:0 5px 0 #8a4505,0 0 0 3px rgba(255,255,255,.8) inset,0 0 26px 6px rgba(255,200,80,.6);animation:biteP .6s ease-in-out infinite}
@keyframes biteP{50%{transform:scale(1.06)}}
#act[data-s="busy"]{filter:grayscale(.6) brightness(.85);cursor:default}
#toast{
  position:absolute;left:50%;top:28%;z-index:6;max-width:86%;text-align:center;padding:14px 20px;border-radius:20px;pointer-events:none;
  background:rgba(255,255,255,.93);color:var(--ink);font:800 16px/1.35 var(--ui);box-shadow:0 8px 24px rgba(0,0,0,.35);
  opacity:0;transform:translate(-50%,10px) scale(.92);transition:opacity .3s,transform .3s cubic-bezier(.2,1.4,.4,1);
}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}

/* panels */
.overlay{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(3,20,34,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.overlay.show{display:flex;animation:fi .25s ease-out}
@keyframes fi{from{opacity:0}to{opacity:1}}
.card{
  width:min(100%,420px);max-height:100%;overflow:auto;padding:18px 16px 16px;border-radius:24px;text-align:center;touch-action:pan-y;
  background:linear-gradient(#18577e,#0f3552);box-shadow:0 0 0 3px rgba(160,220,255,.7),0 20px 44px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.2);
  animation:cin .45s cubic-bezier(.2,1.5,.4,1);
}
@keyframes cin{from{transform:scale(.7) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.card h2{margin:0 0 4px;font:900 24px/1.1 var(--ui);color:#ffe27a;text-shadow:0 2px 0 rgba(0,20,40,.6)}
.card p{margin:6px 0;font-weight:700;color:#d7f0ff;line-height:1.35}
.fishBig{width:min(78%,260px);margin:6px auto;display:block;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-2deg)}}
.badge{display:inline-block;padding:3px 12px;border-radius:12px;font:800 12px/1.5 var(--ui);margin:2px 3px}
.b-common{background:#4f8fb5}.b-rare{background:#8b5fd0}.b-legend{background:linear-gradient(90deg,#ffb020,#ff6a3d)}
.b-new{background:#e8453a;animation:wob 1s ease-in-out infinite}.b-rec{background:#2e9a62}
@keyframes wob{50%{transform:rotate(-3deg) scale(1.08)}}
.btn{display:block;width:100%;margin-top:10px;height:48px;border:0;border-radius:16px;cursor:pointer;font:800 16px/1 var(--ui);color:#0d2a40;
  background:linear-gradient(#ffe083,#ffb420);box-shadow:0 4px 0 #8a5a00,inset 0 0 0 2px #fff3c4}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5a00}
.btn.alt{color:#fff;background:linear-gradient(#2b86b8,#17608a);box-shadow:0 4px 0 #04202f}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,1fr)}}
.fc{padding:6px 4px 8px;border-radius:14px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(160,220,255,.25);font-size:11.5px;line-height:1.25;min-height:104px}
.fc.rare{box-shadow:inset 0 0 0 2px rgba(170,130,255,.7)}
.fc.legend{box-shadow:inset 0 0 0 2px rgba(255,190,70,.9),0 0 14px rgba(255,190,70,.3)}
.fc svg{width:100%;height:46px;display:block}
.fc.unk svg{filter:brightness(0) opacity(.45)}
.fc b{display:block;font-size:12px;color:#fff}
.fc small{display:block;color:#a9d3ea;font-weight:700;font-size:10.5px}
.fc.unk b{color:#9bbdd2}
.sub{font-size:13px;color:#bfe2f5;margin-top:2px}
html,body{-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
@supports (padding:max(0px)){body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}}
@media (pointer:coarse){.chip{min-height:42px}#soundBtn{min-width:44px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>

  <div class="hud top">
    <a class="chip" href="index.html"><svg viewBox="0 0 24 24"><path d="M15.4 5.4 8.8 12l6.6 6.6 1.8-1.8L12.4 12l4.8-4.8z"/></svg>Menyuya qayıt</a>
    <div class="right">
      <button class="chip" id="albumBtn">Albom <b id="albumCount">0/17</b></button>
      <button class="chip" id="soundBtn" aria-label="Səsi aç/bağla">
        <svg class="on" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.6 3 2.4-2.4-1.4-1.4-2.4 2.4-2.4-2.4-1.4 1.4 2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4z"/></svg>
      </button>
    </div>
  </div>
  <div class="chip timechip" id="timeChip"><span id="timeIcon"></span><span id="timeTxt">Gündüz</span></div>

  <div class="hud bottom">
    <div id="tip"></div>
    <div id="powerWrap"><div id="powerBar"><div id="powerFill"></div><i style="left:33.3%"></i><i style="left:66.6%"></i></div>
      <div id="powerLabels"><span>Sığ</span><span>Orta</span><span>Dərin</span></div></div>
    <button id="act" data-s="idle">Atmaq üçün basılı saxla</button>
  </div>

  <div id="toast"></div>

  <div class="overlay" id="catchPanel"><div class="card" id="catchCard"></div></div>
  <div class="overlay" id="albumPanel"><div class="card" id="albumCard"></div></div>
</div>

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ---- Storage helper ---- */
const Store = {
  prefix: 'gemi_oyun5_',
  get(k, d) { try { const r = localStorage.getItem(this.prefix + k); return r === null ? d : JSON.parse(r); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(this.prefix + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---- Audio helper: gentle synthesized sea ambience + soft effects ---- */
const Sound = (function () {
  let ctx = null, master = null, nbuf = null, amb = false, muted = !!Store.get('muted', false);
  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      master = ctx.createGain(); master.gain.value = muted ? 0 : 0.75; master.connect(ctx.destination);
      nbuf = ctx.createBuffer(1, ctx.sampleRate * 3, ctx.sampleRate);
      const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state !== 'running') ctx.resume().catch(function () {});
    return ctx;
  }
  function unlock() {
    ensure(); startAmbient();
    if (ctx && ctx.state === 'running') ['pointerdown', 'pointerup', 'touchstart', 'touchend', 'click', 'keydown', 'mousedown'].forEach(function (e) { window.removeEventListener(e, unlock, true); });
  }
  ['pointerdown', 'pointerup', 'touchstart', 'touchend', 'click', 'keydown', 'mousedown'].forEach(function (e) { window.addEventListener(e, unlock, true); });
  document.addEventListener('visibilitychange', function () { if (!ctx) return; if (document.hidden) { ctx.suspend().catch(function () {}); } else if (ctx.state !== 'running') { ctx.resume().catch(function () {}); } });
  function tone(o) {
    if (muted) return; const c = ensure(); if (!c) return;
    const t0 = c.currentTime + (o.at || 0), dur = o.dur || 0.2, vol = o.vol == null ? 0.15 : o.vol;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(o.f, t0);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.to), t0 + dur);
    if (o.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = o.vib; lg.gain.value = o.f * 0.03; l.connect(lg); lg.connect(osc.frequency); l.start(t0); l.stop(t0 + dur + 0.05); }
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + (o.atk || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master); osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  function noise(o) {
    if (muted) return; const c = ensure(); if (!c) return;
    const t0 = c.currentTime + (o.at || 0), dur = o.dur || 0.2;
    const s = c.createBufferSource(); s.buffer = nbuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = o.type || 'lowpass'; f.frequency.setValueAtTime(o.f || 800, t0);
    if (o.to) f.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + dur);
    f.Q.value = o.q || 0.8;
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, o.vol == null ? 0.15 : o.vol), t0 + (o.atk || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t0, Math.random() * 2); s.stop(t0 + dur + 0.05);
  }
  // two layers of low-passed noise whose volume slowly breathes = waves on a shore
  function startAmbient() {
    if (amb || !ensure()) return; amb = true;
    [[300, 0.07, 0.045], [650, 0.11, 0.02]].forEach(function (p) {
      const s = ctx.createBufferSource(); s.buffer = nbuf; s.loop = true; s.playbackRate.value = 0.7 + Math.random() * 0.4;
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = p[0];
      const g = ctx.createGain(); g.gain.value = p[2];
      const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = p[1]; lg.gain.value = p[2] * 0.8;
      l.connect(lg); lg.connect(g.gain);
      s.connect(f); f.connect(g); g.connect(master); s.start(); l.start();
    });
    scheduleGull();
  }
  // a distant gull every now and then (very quiet)
  function scheduleGull() {
    setTimeout(function () {
      if (!muted && !document.hidden) {
        const base = rand(1500, 1900);
        tone({ f: base, to: base * 0.62, dur: 0.38, vol: 0.022, type: 'triangle', vib: 18 });
        tone({ f: base * 1.05, to: base * 0.6, dur: 0.42, vol: 0.018, type: 'triangle', vib: 20, at: 0.5 });
        if (Math.random() < 0.5) tone({ f: base * 0.95, to: base * 0.55, dur: 0.4, vol: 0.015, type: 'triangle', vib: 16, at: 1.05 });
      }
      scheduleGull();
    }, rand(18000, 42000));
  }
  function setMuted(m) { muted = m; Store.set('muted', m); if (ctx) master.gain.setTargetAtTime(m ? 0 : 0.75, ctx.currentTime, 0.03); }
  return { ensure: ensure, tone: tone, noise: noise, setMuted: setMuted, isMuted: function () { return muted; } };
})();
function buzz(p) { try { if (navigator.vibrate && !Sound.isMuted()) navigator.vibrate(p); } catch (e) {} }
const SFX = {
  charge(p) { Sound.tone({ f: 260 + p * 520, dur: 0.05, vol: 0.025, type: 'sine' }); },
  cast() { Sound.noise({ dur: 0.35, vol: 0.16, type: 'bandpass', f: 500, to: 2600, q: 0.8 }); },
  splash() { Sound.noise({ dur: 0.4, vol: 0.22, type: 'lowpass', f: 2600, to: 300 }); Sound.tone({ f: 420, to: 160, dur: 0.18, vol: 0.12 }); },
  ripple() { Sound.tone({ f: 520, to: 700, dur: 0.12, vol: 0.04 }); },
  bite() { Sound.tone({ f: 330, to: 220, dur: 0.14, vol: 0.18 }); Sound.tone({ f: 440, to: 280, dur: 0.16, vol: 0.14, at: 0.12 }); Sound.noise({ dur: 0.2, vol: 0.12, type: 'lowpass', f: 1500, to: 300 }); },
  reel() { Sound.noise({ dur: 0.03, vol: 0.05, type: 'bandpass', f: 3200, q: 3 }); },
  catchOk() { [523, 659, 784, 1047].forEach(function (f, i) { Sound.tone({ f: f, dur: 0.5, vol: 0.12, type: 'triangle', at: i * 0.11 }); }); },
  rare() { [523, 659, 784, 1047, 1319, 1568].forEach(function (f, i) { Sound.tone({ f: f, dur: 0.7, vol: 0.12, type: 'sine', at: i * 0.12 }); Sound.tone({ f: f * 2, dur: 0.5, vol: 0.04, type: 'sine', at: i * 0.12 }); }); },
  escape() { Sound.tone({ f: 440, to: 330, dur: 0.3, vol: 0.1, type: 'sine' }); Sound.tone({ f: 330, to: 262, dur: 0.4, vol: 0.1, type: 'sine', at: 0.25 }); },
  click() { Sound.tone({ f: 600, to: 480, dur: 0.06, vol: 0.08, type: 'triangle' }); },
  retract() { Sound.noise({ dur: 0.3, vol: 0.1, type: 'bandpass', f: 2400, to: 700, q: 1 }); }
};

/* =====================================================================
   FISH: 17 species, every one drawn as a simple SVG by code
   ===================================================================== */
const OL = '#12304a';
function eyeAt(x, y, r) { return '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="#fff" stroke="' + OL + '" stroke-width="1.6"/><circle cx="' + (x + r * 0.2) + '" cy="' + y + '" r="' + (r * 0.5) + '" fill="' + OL + '"/>'; }
function wrapSvg(inner) { return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 70" stroke-linejoin="round" stroke-linecap="round">' + inner + '</svg>'; }

// generic lens-shaped fish; o = {key,h,x0,x1,body,belly,fin,tail,stripes,mouth}
function torpedo(o) {
  const x0 = o.x0 || 22, x1 = o.x1 || 108, h = o.h, L = x1 - x0, top = 35 - h, bot = 35 + h, fin = o.fin || o.body;
  const bodyD = 'M' + x0 + ' 35C' + (x0 + L * 0.28) + ' ' + top + ' ' + (x1 - L * 0.3) + ' ' + top + ' ' + x1 + ' 35C' + (x1 - L * 0.3) + ' ' + bot + ' ' + (x0 + L * 0.28) + ' ' + bot + ' ' + x0 + ' 35Z';
  let s = '';
  const th = h * 0.95 + 4;
  const tails = {
    fork: 'M' + (x0 + 2) + ' 35L' + (x0 - 16) + ' ' + (35 - th) + 'Q' + (x0 - 8) + ' 35 ' + (x0 - 16) + ' ' + (35 + th) + 'Z',
    moon: 'M' + (x0 + 2) + ' 35L' + (x0 - 14) + ' ' + (35 - th - 8) + 'Q' + (x0 - 4) + ' 35 ' + (x0 - 14) + ' ' + (35 + th + 8) + 'Z',
    fan: 'M' + (x0 + 2) + ' 35C' + (x0 - 4) + ' ' + (35 - h * 1.5) + ' ' + (x0 - 14) + ' ' + (35 - h * 1.9) + ' ' + (x0 - 18) + ' ' + (35 - h * 0.8) + 'Q' + (x0 - 10) + ' 35 ' + (x0 - 18) + ' ' + (35 + h * 0.8) + 'C' + (x0 - 14) + ' ' + (35 + h * 1.9) + ' ' + (x0 - 4) + ' ' + (35 + h * 1.5) + ' ' + (x0 + 2) + ' 35Z'
  };
  s += '<path d="' + tails[o.tail || 'fork'] + '" fill="' + fin + '" stroke="' + OL + '" stroke-width="2.2"/>';
  s += '<path d="M' + (x0 + L * 0.3) + ' ' + (top + h * 0.2) + 'Q' + (x0 + L * 0.48) + ' ' + (top - h * 0.9 - 5) + ' ' + (x0 + L * 0.66) + ' ' + (top + h * 0.2) + 'Z" fill="' + fin + '" stroke="' + OL + '" stroke-width="2.2"/>';
  s += '<path d="M' + (x0 + L * 0.42) + ' ' + (bot - h * 0.2) + 'Q' + (x0 + L * 0.52) + ' ' + (bot + h * 0.5 + 3) + ' ' + (x0 + L * 0.66) + ' ' + (bot - h * 0.2) + 'Z" fill="' + fin + '" stroke="' + OL + '" stroke-width="2.2"/>';
  s += '<path d="' + bodyD + '" fill="' + o.body + '"/>';
  s += '<path d="M' + x0 + ' 35C' + (x0 + L * 0.28) + ' ' + (35 + h * 0.3) + ' ' + (x1 - L * 0.3) + ' ' + (35 + h * 0.3) + ' ' + x1 + ' 35C' + (x1 - L * 0.3) + ' ' + bot + ' ' + (x0 + L * 0.28) + ' ' + bot + ' ' + x0 + ' 35Z" fill="' + (o.belly || o.body) + '"/>';
  s += '<clipPath id="cp' + o.key + '"><path d="' + bodyD + '"/></clipPath><g clip-path="url(#cp' + o.key + ')">';

    g.fillStyle = 'rgba(' + lightC + ',' + (lightC - (warmC > 0.5 ? 20 : 0)) + ',' + (lightC - (warmC > 0.5 ? 40 : 0)) + ',' + (0.55 - nf * 0.3) + ')';

  });

  g.beginPath(); g.moveTo(cw * 0.62, hy + 3); g.quadraticCurveTo(cw * 0.7, hy - 28 * u, cw * 0.8, hy - 14 * u); g.quadraticCurveTo(cw * 0.88, hy - 30 * u, cw * 0.96, hy + 3); g.closePath(); g.fill();

function drawSea() {

  for (let i = 0; i < 18; i++) { const x = ((i * 61.7 + time * 6 * (0.5 + (i % 4) * 0.2)) % cw), y = hy + 4 + ((i * 37) % (sy - hy - 6)); g.fillRect(x, y, 10 * u + (i % 3) * 4, 1.6); }

}
function drawSeabedDecor(dark) {
  for (let i = 0; i < 16; i++) {
    const x = bx + 40 * u + (i / 15) * (cw - bx - 50 * u) + ((i * 37) % 17), y = seabedY(x);

      g.fillStyle = 'rgba(255,255,255,.12)'; g.beginPath(); g.ellipse(x - 5 * u, y - 5 * u, 9 * u, 4 * u, 0, 0, 6.3); g.fill();

function drawBoat() {
  const x = bx, y = sy, s = u, sway = Math.sin(time * 1.3) * 0.02, nf = nightFactor(hour);

  g.fillStyle = '#c47a3e'; g.beginPath(); g.moveTo(-68, -14); g.lineTo(72, -14); g.lineTo(70, -6); g.lineTo(-66, -6); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(60,34,16,.5)'; g.lineWidth = 2; g.beginPath(); g.moveTo(-60, 4); g.lineTo(58, 4); g.stroke();
  g.fillStyle = '#e8453a'; g.fillRect(-70, -16, 144, 4);
  // lantern
  g.strokeStyle = '#3c2210'; g.lineWidth = 3; g.beginPath(); g.moveTo(-58, -14); g.lineTo(-58, -48); g.lineTo(-46, -48); g.stroke();
  g.fillStyle = nf > 0.3 ? '#ffe27a' : '#caa24a'; g.fillRect(-52, -46, 10, 12); g.strokeRect(-52, -46, 10, 12);
  if (nf > 0.2) { const gl = g.createRadialGradient(-47, -40, 2, -47, -40, 90); gl.addColorStop(0, 'rgba(255,220,120,' + 0.55 * nf + ')'); gl.addColorStop(1, 'rgba(255,200,100,0)'); g.fillStyle = gl; g.fillRect(-140, -130, 190, 190); }

  g.fillStyle = '#f2b533'; g.strokeStyle = '#3c2210'; g.lineWidth = 2.5;
  g.beginPath(); g.moveTo(-16, -14); g.quadraticCurveTo(-20, -40, -6, -46); g.quadraticCurveTo(10, -44, 12, -14); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = '#ffd0a0'; g.beginPath(); g.arc(-4, -56, 10, 0, 6.3); g.fill(); g.stroke();
  g.fillStyle = '#e8c36a'; g.beginPath(); g.ellipse(-4, -62, 17, 4.5, 0, 0, 6.3); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-12, -63); g.quadraticCurveTo(-4, -78, 4, -63); g.fill(); g.stroke();
  g.fillStyle = '#c0453a'; g.fillRect(-12, -65, 16, 3);

  g.strokeStyle = '#8a5a2a'; g.lineWidth = 3.2 * u; g.beginPath(); g.moveTo(px, py); g.quadraticCurveTo(px + Math.cos(a) * len * 0.5, py + Math.sin(a) * len * 0.5 + (state === 'reel' ? 10 * u : 0), tx, ty); g.stroke();
  g.strokeStyle = '#d8e6f0'; g.lineWidth = 2 * u; g.beginPath(); g.arc(px - 2 * u, py + 4 * u, 5 * u, 0, 6.3); g.stroke();
}
const rodTip = { x: 0, y: 0 };
function drawLine() {
  if (state === 'idle' || state === 'charging' || state === 'result') return;
  g.strokeStyle = 'rgba(245,250,255,.85)'; g.lineWidth = 1.4;
  const bobY = bob.y + (state === 'waiting' || state === 'bite' || state === 'reel' ? bob.dip * 6 * u : 0);
  g.beginPath(); g.moveTo(rodTip.x, rodTip.y);

  g.quadraticCurveTo((rodTip.x + bob.x) / 2, Math.max(rodTip.y, bobY) + sag, bob.x, bobY - 8 * u); g.stroke();

    g.strokeStyle = 'rgba(245,250,255,.5)'; g.beginPath(); g.moveTo(bob.x, bobY); g.quadraticCurveTo(bob.x + Math.sin(time * 2) * 3, (bobY + hy2) / 2, hx, hy2); g.stroke();

function drawBobber() {

  g.fillStyle = '#e8453a'; g.beginPath(); g.arc(0, 0, 7 * u, Math.PI, 0); g.fill(); g.stroke();

function drawRipples() {
  ripples.forEach(function (r) { const t = r.age / r.life; g.strokeStyle = 'rgba(255,255,255,' + (0.6 * (1 - t)) + ')'; g.lineWidth = 1.6; g.beginPath(); g.ellipse(r.x, r.y + 1, r.r * u * (0.3 + t), r.r * u * (0.3 + t) * 0.28, 0, 0, 6.3); g.stroke(); });

function drawFishImg(sp, x, y, dir, size, alpha, wig) {

function drawUnderwater() {

  });
  bubbles.forEach(function (b) { g.strokeStyle = 'rgba(255,255,255,.4)'; g.lineWidth = 1.2; g.beginPath(); g.arc(b.x, b.y, b.r * u, 0, 6.3); g.stroke(); });
  if ((state === 'bite' || state === 'reel') && biteFish) {
    const bf = biteFish, dir = bf.x > hook.x ? -1 : -1;

function drawReelUI() {
  if (state !== 'reel' || !reel) return;

function drawJump() {

function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

function render() {

/* ---- main loop ---- */
let last = performance.now();
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  update(dt); render();
}
resize();
for (let i = 0; i < 7; i++) { const f = spawnAmbient(null, true); }
tip(totalCasts === 0 ? 'Atmaq üçün düyməni basılı saxla, sonra burax. Uzağa atsan, daha dərin suya düşər.' : 'Xoş gəldin! Dənizin səsinə qulaq as.');

window.addEventListener('beforeunload', function () { Store.set('hour', +hour.toFixed(2)); });
})();
</script>
